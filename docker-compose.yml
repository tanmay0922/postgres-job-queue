services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 2s
      timeout: 3s
      retries: 20

  # API + worker, reachable on localhost:8080.
  app:
    build: .
    image: postgres-job-queue
    environment: &db-env
      DATABASE_URL: jdbc:postgresql://db:5432/jobs
      DATABASE_USERNAME: jobs
      DATABASE_PASSWORD: jobs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Two more instances (not exposed to the host) competing for the same queue.
  # FOR UPDATE SKIP LOCKED keeps them from ever claiming the same job.
  worker:
    build: .
    image: postgres-job-queue
    environment: *db-env
    deploy:
      replicas: 2
    depends_on:
      app:
        condition: service_started
